name: VESTIGE CI Quality & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Linting & Production Build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_SUPABASE_URL: https://qiylcwurlhyhzhachoyb.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-ci-anon-key

  # ----------------------------------------------------------------------------
  # Job 2: Backend Compilation, Unit Tests & Maven Verification
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests & Package
        run: ./mvnw clean test package -B
